backend:
  name: github
  repo: Harwirz/Harwirz.github.io
  branch: main

site_url: https://harwirz.github.io
media_folder: "assets/images"
public_folder: "/assets/images"

output:
  omit_empty_optional_fields: true

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "_posts"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    fields:
      - label: "布局"
        name: "layout"
        widget: "hidden"
        default: "post"
      - label: "标题"
        name: "title"
        widget: "string"
        required: true
      - label: "发布时间"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        input_timezone: "Asia/Shanghai"
        picker_utc: false
        output_utc: false
        required: true
      - label: "分类"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - "杂文"
          - "笔记"
          - "分享"
        default:
          - "杂文"
        required: true
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
      - label: "自定义缩略图（可选，留空自动取正文首图）"
        name: "thumbnail"
        widget: "image"
        required: false
      - label: "缩略图说明（可选）"
        name: "thumbnail_alt"
        widget: "string"
        required: false
      - label: "自定义固定链接（可选，新文章留空；用于保留旧文章网址）"
        name: "permalink"
        widget: "string"
        required: false
      - label: "正文"
        name: "body"
        widget: "markdown"
        modes:
          - "rich_text"
          - "raw"
