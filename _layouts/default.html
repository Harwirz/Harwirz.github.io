<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2c2c2c">
    {% seo %}
    {% feed_meta %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <script src="{{ '/assets/archive.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <header class="site-header">
      <a class="avatar-link" href="{{ '/about/' | relative_url }}" aria-label="查看个人资料"><img class="avatar" src="{{ site.profile.avatar | relative_url }}" alt="个人头像" width="32" height="32"></a>
      <p class="welcome-greeting">{{ site.profile.greeting | escape }}</p>
      <nav class="top-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>文章</a>
        <a href="{{ '/archive/' | relative_url }}"{% if page.layout == 'archive' %} aria-current="page"{% endif %}>归档</a>
      </nav>
    </header>
    <div class="site-shell">
      {{ content }}
    </div>
  </body>
</html>
